async function persist(message){data.revision=(data.revision||0)+1;data.savedAt=new Date().toISOString();pending=true;try{localStorage.setItem(LOCAL_KEY+(configured?':recovery':''),JSON.stringify(configured?{data,baseRevision:revision,pending:true}:data))}catch{showNotice('Browser storage is unavailable. Export a backup before closing.')}if(configured){saving=true;status('Saving…');render();try{const result=await api('/rest/v1/rpc/emz_save',{expected_revision:revision,document:data});revision=result.revision;pending=false;localStorage.removeItem(LOCAL_KEY+':recovery');cloudError='';status('Saved online');toast(message)}catch(e){cloudError=e.message;if(/conflict/i.test(e.message)){conflict=true;showNotice('Another team member saved a newer version. Your changes are preserved locally. Use Resolve conflict to review both copies.')}else showNotice('Save failed. Your changes are kept on this device. Use Retry save when connected.');status(conflict?'Edit conflict':'Save failed')}finally{saving=false}}else{pending=false;status('Saved on this device');toast(message+' · Local preview')}render()}
async function change(fn,message){assertEdit();const before=copy(data);try{fn()}catch(e){data=before;throw e}undo=before;await persist(message)}
function showNotice(msg){$('#notice').hidden=!msg;$('#notice').textContent=msg}
function options(obj,current){return Object.entries(obj).map(([k,v])=>`<option value="${esc(k)}" ${k===current?'selected':''}>${esc(v)}</option>`).join('')}
function formatDate(d){return date(d)?new Date(d+'T12:00:00Z').toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short',timeZone:'UTC'}):'Unscheduled'}
function dates(p){return `${formatDate(p.date)} · ${p.time||'Time not set'}`}
function monthName(){return new Date(ui.month+'-15T12:00:00Z').toLocaleDateString('en-GB',{month:'long',year:'numeric',timeZone:'UTC'})}
function clientStage(p){return ({ideas:'Planned',writing:'Planned',production:'In production',ready:'Ready to publish',published:'Published'})[p.stage]||'Planned'}
function refs(p){const a=p.reference.split(/\s+/).filter(url);return a.length?a.map((s,i)=>`<a href="${esc(url(s))}" target="_blank" rel="noopener">${a.length>1?'Reference '+(i+1):'Open reference'} ↗</a>`).join(''):'<span>No reference</span>'}
function getPosts(){let f={...ui,me:ui.me||data.settings.editor};const saved=data.views.find(v=>v.id===ui.preset);if(saved)f.preset=saved.config.preset||'all';if(['week','overdue','unscheduled'].includes(f.preset)||(ui.view==='calendar'&&ui.cal==='week'))f.month='';let out=filtered(data,f);if(ui.advanced.length)out=out.filter(p=>{const results=ui.advanced.map(r=>{const val=String(p[r.field]??'').toLowerCase(),q=String(r.value).toLowerCase();return r.op==='empty'?!val:r.op==='notempty'?!!val:r.op==='is'?val===q:r.op==='not'?val!==q:val.includes(q)});return ui.logic==='or'?results.some(Boolean):results.every(Boolean)});return out}
function badge(p){return `<span class="badge ${p.stage==='ready'?'green':''}"><i class="stage-dot stage-${esc(p.stage)}"></i>${esc(mode==='client'?clientStage(p):data.stages[p.stage]||p.stage)}</span>`}
function card(p,compact=false){const props=compact||mode==='client'?['date','platforms','reference','finalLink']:ui.properties;return `<article class="card" draggable="${mode==='team'&&canEdit&&!saving}" data-card="${esc(p.id)}">${ui.preview&&url(p.cover)?`<img class="card-cover" src="${esc(url(p.cover))}" alt="Cover for ${esc(p.title)}" loading="lazy">`:''}<div class="card-body"><div class="card-kicker"><span>${esc(TYPES[p.type]||p.type)}</span>${mode==='team'&&!compact?`<input type="checkbox" aria-label="Select ${esc(p.title)}" data-select="${esc(p.id)}" ${selected.has(p.id)?'checked':''}>`:badge(p)}</div><button class="card-title" data-post="${esc(p.id)}">${esc(p.title||'Untitled idea')}</button>${props.map(k=>k==='date'?`<div class="card-meta">${esc(dates(p))}</div>`:k==='owner'?`<div class="card-meta">${esc(p.writer||'Writer not assigned')}<br>${esc(p.designer||'Designer not assigned')}</div>`:k==='reference'?`<div class="card-links">${refs(p)}</div>`:k==='finalLink'?`<div class="card-links"><span>Ready to publish</span>${url(p.finalLink)?`<a href="${esc(url(p.finalLink))}" target="_blank" rel="noopener">Open final file ↗</a>`:'<span>Final file not added yet</span>'}</div>`:k==='platforms'?`<div class="card-meta">${esc(p.platforms.join(' · ')||'Platform not set')}</div>`:k==='priority'?`<span class="badge">${esc(p.priority)} priority</span>`:k==='deadline'?`<div class="card-meta">Production due ${esc(p.deadline||'not set')}</div>`:k==='campaign'?`<div class="card-meta">${esc(p.campaign||'No campaign')}</div>`:k==='checks'?`<div class="card-meta">${p.checks.filter(c=>c.done).length}/${p.checks.length} tasks · ${p.comments.length} comments</div>`:k==='stage'?badge(p):'').join('')}${mode==='team'&&!compact?`<div class="card-actions"><select data-move="${esc(p.id)}" aria-label="Move ${esc(p.title)}" ${!canEdit||saving?'disabled':''}>${options(data.stages,p.stage)}</select><button data-menu="${esc(p.id)}" aria-label="Actions for ${esc(p.title)}">•••</button></div>`: function groupValue(p,k){return k==='platforms'?(p.platforms[0]||'Unassigned'):p[k]||'Unassigned'}
function board(posts){const field=ui.group;const values=field==='stage'?Object.keys(data.stages):[...new Set(posts.map(p=>groupValue(p,field)))];const order=[...ui.columns.filter(v=>values.includes(v)),...values.filter(v=>!ui.columns.includes(v))].filter(v=>!ui.hidden.includes(v));const subs=ui.subgroup?[...new Set(posts.map(p=>groupValue(p,ui.subgroup)))]:[''];return `<div class="${ui.color?'color-lanes':''} size-${esc(ui.size)} fit-${esc(ui.fit)}">${subs.map(sub=>`${sub?`<h3 class="subgroup">${esc(sub)}</h3>`:''}<div class="board">${order.map((v,i)=>{const list=posts.filter(p=>groupValue(p,field)===v&&(!sub||groupValue(p,ui.subgroup)===sub));const metric=ui.calc==='missing'?list.filter(p=>!url(p.finalLink)).length+' missing final':ui.calc==='ready'?(list.length?Math.round(list.filter(p=>p.stage==='ready'||p.stage==='published').length/list.length*100):0)+'% ready':list.length;return `<section class="lane" data-lane="${esc(v)}" data-sub="${esc(sub)}" style="--lane-color:${['#c0a28b','#c4ab67','#9b83c1','#73a88c','#6f9abc'][i%5]}"><div class="lane-title" draggable="${mode==='team'}" data-column="${esc(v)}"><i class="stage-dot stage-${esc(v)}"></i><strong>${esc(field==='stage'?data.stages[v]:v)}</strong><span class="lane-count">${metric}</span><button data-hide="${esc(v)}" aria-label="Hide ${esc(v)} column">−</button></div>${list.map(p=>card(p)).join('')||'<p class="empty tiny">No posts</p>'}${mode==='team'&&canEdit?`<button class="lane-add" data-add-group="${esc(v)}" data-sub="${esc(sub)}">＋ New post</button>`:''}</section>`}).join('')}</div>`).join('')}${ui.hidden.length?`<div class="compact-note">${ui.hidden.length} hidden columns <button data-action="show-columns">Show all</button></div>`:''}</div>`}
function calendar(posts){const isWeek=ui.cal==='week';let start,count;if(isWeek){const anchor=ui.week||today(data.settings.timezone),n=new Date(anchor+'T12:00:00Z').getUTCDay();start=addDays(anchor,-((n+1)%7));count=7}else{const d=ui.month+'-01';start=addDays(d,-((new Date(d+'T12:00:00Z').getUTCDay()+1)%7));count=Math.ceil(((new Date(d+'T12:00:00Z').getUTCDay()+1)%7+new Date(+ui.month.slice(0,4),+ui.month.slice(5),0).getDate())/7)*7}const unscheduled=posts.filter(p=>!p.date);const days=Array.from({length:count},(_,i)=>addDays(start,i));return `${mode==='team'?`<details class="unscheduled" ${ui.preset==='unscheduled'?'open':''}><summary>Unscheduled ideas · ${unscheduled.length} — drag an idea to a date</summary><div class="unscheduled-list">${unscheduled.map(p=>card(p)).join('')||'<p class="muted tiny">New ideas without a date appear here.</p>'}</div></details>`:''}<div class="calendar-head">${['Sat','Sun','Mon','Tue','Wed','Thu','Fri'].map(x=>`<span>${x}</span>`).join('')}</div><div class="calendar-grid ${isWeek?'week':''}">${days.map(d=>{const list=posts.filter(p=>p.date===d);return `<div class="day ${d.startsWith(ui.month)?'':'other'} ${list.length?'has-posts':''} ${d===today(data.settings.timezone)?'today':''}" data-date="${d}"><div class="day-label"><b>${+d.slice(8)}</b>${mode==='team'&&canEdit?`<button data-add-date="${d}" aria-label="Add post on ${d}">＋</button>`:''}<span class="dot-count">${list.length?list.length+' posts':''}</span></div>${data.notes.filter(n=>n.date===d&&(mode==='team'||!n.internal)).map(n=>`<p class="calendar-note">${esc(n.text)}</p>`).join('')}${list.map(p=>card(p,true)).join('')}</div>`}).join('')}</div><div class="agenda-mobile">${days.filter(d=>posts.some(p=>p.date===d)).map(d=>`<h3 id="day-${d}">${formatDate(d)}</h3>${posts.filter(p=>p.date===d).map(p=>card(p)).join('')}`).join('')}</div>`}
function table(posts){return `<div class="table-wrap"><table><thead><tr>${mode==='team'?'<th><input type="checkbox" id="select-all" aria-label="Select all filtered posts"></th>':''}<th>Idea</th><th>Publish date / time</th><th>Format / Platform</th><th>Status</th><th>Reference → Final file</th>${mode==='team'?'<th>Writer / Designer</th>':''}</tr></thead><tbody>${posts.map(p=>`<tr>${mode==='team'?`<td><input type="checkbox" data-select="${esc(p.id)}" aria-label="Select ${esc(p.title)}" ${selected.has(p.id)?'checked':''}></td>`:''}<td><button class="card-title table-title" data-post="${esc(p.id)}">${esc(p.title)}</button><small>${esc(p.service)}</small></td><td>${mode==='team'&&canEdit?`<input type="date" aria-label="Publish date for ${esc(p.title)}" data-inline="date" data-id="${esc(p.id)}" value="${esc(p.date)}"><br><input type="time" aria-label="Publish time for ${esc(p.title)}" data-inline="time" data-id="${esc(p.id)}" value="${esc(p.time)}">`:esc(dates(p))}</td><td>${esc(TYPES[p.type]||p.type)}<br><small>${esc(p.platforms.join(', ')||'Platform not set')}</small></td><td>${mode==='team'&&canEdit?`<select data-move="${esc(p.id)}" aria-label="Stage for ${esc(p.title)}">${options(data.stages,p.stage)}</select>`:badge(p)}</td><td>${refs(p)}${url(p.finalLink)?`<a href="${esc(url(p.finalLink))}" target="_blank" rel="noopener">Final: ${esc(p.finalLink)}</a>`:'<small>Final file not added yet</small>'}</td>${mode==='team'?`<td>${esc(p.writer||'Unassigned')}<br>${esc(p.designer||'Unassigned')}</td>`:''}</tr>`).join('')}</tbody></table></div>`}
function media(p){const items=String(p.media||'').split(/\s+/).filter(url);if(items.length)return `<div class="carousel">${items.map(s=>`<img loading="lazy" src="${esc(url(s))}" alt="${esc(p.title)} — carousel image">`).join('')}</div>`;if(/\.(mp4|webm)(\?|$)/i.test(p.finalLink)&&url(p.finalLink))return `<video controls preload="metadata" ${url(p.cover)?`poster="${esc(url(p.cover))}"`:''} src="${esc(url(p.finalLink))}"></video>`;const img=url(p.cover)||(/\.(png|jpe?g|webp|gif)(\?|$)/i.test(p.finalLink)?url(p.finalLink):'');return img?`<img src="${esc(img)}" loading="lazy" alt="${esc(p.title)}">`:'<span>Preview not added · Open the final file below</span>'}

function render(){const p=getPosts(),monthPosts=data.posts.filter(p=>!p.archived&&p.date.startsWith(ui.month));const team=mode==='team';$('#heading').textContent=({calendar:'Content calendar',board:'Production board',table:'All posts',feed:'Feed preview'})[ui.view];$('#subtitle').textContent=team?'Plan, create, and deliver — one workspace for the whole team.':'The idea, the reference, and what goes live next.';$$('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));$('.heading-actions').hidden=!team;$('#account-btn').textContent=openEditing?(ui.me||'Your name'):session?'Account':'Team sign in';$('#views').innerHTML=Object.entries({calendar:'▦ Calendar',board:'▥ Board',table:'☷ Table',feed:'▧ Feed'}).map(([k,l])=>`<button data-view="${k}" class="${ui.view===k?'active':''}">${l}</button>`).join('');$('#month').value=ui.month;

function preview(p){return `<div class="facts"><span><small>Publish date</small>${esc(formatDate(p.date))}</span><span><small>Publish time</small>${esc(p.time||'Time not set')}</span><span><small>Timezone</small>${esc(data.settings.timezone||'Not set')}</span><span><small>Platform</small>${esc(p.platforms.join(', ')||'Not set')}</span>${badge(p)}</div><section><h3>The idea</h3><p class="body-copy">${esc(p.summary||p.title)}</p></section><section><h3>Reference</h3><div class="reference-list">${refs(p)}${p.reference.split(/\s+/).filter(url).map(u=>`<a href="${esc(url(u))}" target="_blank" rel="noopener">${esc(u)}</a>`).join('')}</div></section><section><h3>Ready to publish</h3><div class="final-block">${url(p.finalLink)?`<a class="url-visible" href="${esc(url(p.finalLink))}" target="_blank" rel="noopener">${esc(p.finalLink)} ↗</a><div class="feed-media" style="margin-top:15px">${media(p)}</div>`:'<p>Final file not added yet</p><small>The team will add the finished reel, image or carousel here.</small>'}</div></section><section><h3>Caption for publication <button data-action="copy-caption" style="float:right">Copy caption</button></h3><p class="body-copy">${esc(p.caption||'Caption not added yet')}</p></section>${p.tov?`<section><h3>Artwork / on-screen text</h3><p class="body-copy">${esc(p.tov)}</p></section>`:''}${url(p.postingLink)?`<a href="${esc(url(p.postingLink))}" target="_blank" rel="noopener">View published post ↗</a>`:''}`}
function renderPost(){const p=editor,editing=mode==='team'&&canEdit;$('#post-content').innerHTML=`<header class="panel-head"><div><small>${esc(p.id)} · ${esc(TYPES[p.type])}</small><h2>${esc(p.title||'New post')}</h2></div><button data-action="close-post" aria-label="Close post">×</button></header>${editing?`<nav class="panel-tabs" aria-label="Post sections">${Object.entries({content:'Content',design:'Design brief',delivery:'Final delivery',discussion:'Team notes',history:'History'}).map(([k,v])=>`<button data-editor-tab="${k}" class="${k===editorTab?'active':''}">${v}</button>`).join('')}</nav>`:''}<div class="panel-body">${editing?editBody():preview(p)}</div>${editing?`<footer class="panel-footer"><button data-action="archive-post">${p.archived?'Restore':'Archive'}</button><button data-action="duplicate-post">Duplicate</button><small id="draft-status">${editorDirty?'Unsaved draft':'All fields in this post stay together'}</small><button class="primary" data-action="save-post" ${saving?'disabled':''}>Save post</button></footer>`:`<footer class="panel-footer"><button data-action="copy-post-link">Copy post link</button><span class="spacer"></span><button data-action="close-post">Close</button></footer>`}`;}
function editBody(){const p=editor;if(editorTab==='content')return `<form id="edit-form"><div class="field-grid">${field('title','Idea title','text',true)}<label>Format<select name="type">${options(TYPES,p.type)}</select></label><label>Stage<select name="stage">${options(data.stages,p.stage)}</select></label>${field('date','Publish date','date')}${field('time','Publish time','time')}<p class="field-note wide">${esc(data.settings.timezone||'Set the clinic timezone in Workspace settings.')} · Leaving the date blank keeps the post in Unscheduled ideas.</p><div class="wide pill-list">${['Instagram','Facebook','TikTok','LinkedIn','YouTube'].map(s=>`<label class="check"><input type="checkbox" name="platforms" value="${s}" ${p.platforms.includes(s)?'checked':''}>${s}</label>`).join('')}</div>${field('summary','The idea','textarea',true)}${field('hook','Opening hook','textarea',true)}${field('caption','Caption','textarea',true)}${field('cta','Call to action')}${field('service','Clinic service')}${field('campaign','Campaign')}${field('pillar','Content pillar')}${field('reference','Reference URLs — one per line','textarea',true)}${field('writer','Writer / content owner')}${field('designer','Designer / video editor')}${field('deadline','Production deadline','date')}<label>Priority<select name="priority">${options({High:'High',Normal:'Normal',Low:'Low'},p.priority)}</select></label>${data.customFields.map(f=>`<label>${esc(f.label)}<input data-custom="${esc(f.id)}" name="custom-${esc(f.id)}" type="${esc(f.type)}" ${f.type==='checkbox'?(p.custom[f.id]?'checked':''):`value="${esc(p.custom[f.id]||'')}"`}></label>`).join('')}</div></form><div class="utility-actions"><button data-action="template">Apply format template</button></div>`;
 if(editorTab==='design')return `<form id="edit-form"><div class="field-grid">${field('visual','Visual direction / design brief','textarea',true)}${field('tov','Artwork / on-screen text','textarea',true)}${field('script','Full script','textarea',true)}${field('shotList','Shot list / angles','textarea',true)}${field('audio','Audio / music reference URL or notes','textarea',true)}${field('deliverables','Deliverables / handoff notes','textarea',true)}${field('internal','Internal production notes','textarea',true)}</div></form>`;
 if(editorTab==='delivery')return `<form id="edit-form"><h3>Reference</h3><div class="reference-list">${refs(p)}</div><h3 style="margin-top:25px">Ready to publish</h3><div class="final-block">${field('finalLink','Final file URL — finished reel, image or carousel folder','url',true)}<p class="field-note">Add the final link once the asset is finished. This is the same link shown in every view.</p>${url(p.finalLink)?`<a class="url-visible" href="${esc(url(p.finalLink))}" target="_blank" rel="noopener">${esc(p.finalLink)} ↗</a>`:''}</div><div class="field-grid" style="margin-top:23px">${field('cover','Cover / thumbnail — direct image URL','url',true)}${field('media','Carousel previews — direct image URLs in order, one per line','textarea',true)}${field('postingLink','Published social-post URL','url',true)}</div><p class="field-note">Drive, Canva and Instagram links remain clickable. For an inline preview, add an accessible direct image/video URL. A final link does not publish to social media.</p></form>`;
 if(editorTab==='discussion')return `<section><h3>Production checklist</h3>${p.checks.map((c,i)=>`<div class="check-row"><input type="checkbox" data-check="${i}" aria-label="${esc(c.label)}" ${c.done?'checked':''}><span>${esc(c.label)}<small style="display:block">${esc(c.owner||'Unassigned')} ${esc(c.due||'')}</small></span><button data-delete-check="${i}" aria-label="Remove task">×</button></div>`).join('')}<button data-action="add-check">＋ Add task</button></section><section><h3>Internal comments</h3><p class="field-note">Mention a team member as @email. Mentions appear in their team inbox when they open the workspace.</p>${p.comments.map(c=>`<div class="comment"><small>${esc(c.author)} · ${new Date(c.at).toLocaleString()}</small><p>${esc(c.text)}</p></div>`).join('')||'<p class="muted">No comments yet.</p>'}<textarea id="comment-text" rows="3" aria-label="New internal comment" placeholder="Add a note or @mention…"></textarea><button data-action="add-comment">Add comment to draft</button></section>`;
 return `<section><h3>Activity</h3>${p.history.map(h=>`<div class="history-row">${esc(h.text)}<small>${esc(h.by)} · ${new Date(h.at).toLocaleString()}</small></div>`).join('')||'<p class="muted">No changes recorded yet.</p>'}</section><section><h3>Previous versions</h3>${p.versions.map((v,i)=>`<div class="history-row">${new Date(v.at).toLocaleString()} · ${esc(v.by)}<br><button data-version="${i}">Restore this version to draft</button></div>`).join('')||'<p class="muted">Saving an edited post creates a restorable version.</p>'}</section>`;
}
function newPost(values={}){return migrate({...data,posts:[{id:'EMZ-'+crypto.randomUUID().slice(0,8),title:'',order:Date.now(),...values}]}).posts[0]}
function openPost(id,values){if(editorDirty&&!confirm('Discard the unsaved draft?'))return;editor=copy(data.posts.find(p=>p.id===id)||newPost(values));editorBase=copy(editor);editorTab='content';editorDirty=false;try{const recovered=JSON.parse(sessionStorage.getItem('emz-draft')||'null');if(recovered&&recovered.id===editor.id&&confirm('Restore the unsaved draft for this post?')){editor=recovered;editorDirty=true}}catch{}renderPost();if(!$('#post-dialog').open)$('#post-dialog').showModal();}
function markDirty(){editorDirty=true;if($('#draft-status'))$('#draft-status').textContent='Unsaved draft';try{sessionStorage.setItem('emz-draft',JSON.stringify(editor))}catch{}}
async function savePost(){collectEditor();if(!editor.title.trim())return toast('Add an idea title.');if(editor.date&&!date(editor.date))return toast('Enter a valid publish date.');for(const k of ['finalLink','cover','postingLink'])if(editor[k]&&!url(editor[k]))return toast('Use a complete http:// or https:// URL for '+k+'.');if(editor.stage==='ready'&&!url(editor.finalLink))return toast('Add the finished file URL before marking this post Ready to publish.');if(editor.stage==='published'&&editorBase.stage!=='published'&&!confirm('Confirm this post has actually been published on the social platform.'))return;await change(()=>{const p=copy(editor),old=data.posts.find(x=>x.id===p.id);log(p,old?'Updated post':'Created post',old);const i=data.posts.findIndex(x=>x.id===p.id);if(i<0)data.posts.push(p);else data.posts[i]=p;editor=copy(p);editorBase=copy(p);editorDirty=false;sessionStorage.removeItem('emz-draft');},'Post saved');renderPost()}
function utility(title,body){$('#utility-content').innerHTML=`<header class="panel-head"><h2>${esc(title)}</h2><button data-action="close-utility" aria-label="Close window">×</button></header><div class="panel-body">${body}</div>`;if(!$('#utility').open)$('#utility').showModal()}
function inputForm(title,fields,action){utility(title,`<form id="utility-form" data-form="${action}"><div class="field-grid">${fields}</div><div class="error" id="utility-error" role="alert"></div><div class="utility-actions"><button class="primary" type="submit">Save</button><button type="button" data-action="close-utility">Cancel</button></div></form>`)}
function input(name,label,type='text',value=''){return `<label>${label}<input name="${name}" type="${type}" value="${esc(value)}"></label>`}
function select(name,label,opts,current){return `<label>${label}<select name="${name}">${options(opts,current)}</select></label>`}
function viewOptions(){utility('View options',`<div class="option-grid">${select('sort','Sort posts',{date:'Publish date',manual:'Manual order',title:'Title',priority:'Priority'},ui.sort)}${select('size','Card size',{small:'Small',medium:'Medium',large:'Large'},ui.size)}${select('fit','Image fit',{cover:'Fill card',contain:'Fit full image'},ui.fit)}${select('calc','Column calculation',{count:'Post count',missing:'Missing final files',ready:'Percent ready / published'},ui.calc)}<label class="check"><input name="preview" type="checkbox" ${ui.preview?'checked':''}>Show cover images</label><label class="check"><input name="color" type="checkbox" ${ui.color?'checked':''}>Tint board columns</label></div><h3 style="margin:25px 0 10px">Card properties</h3>${['date','owner','reference','finalLink','platforms','priority','deadline','campaign','checks','stage'].sort((a,b)=>{const ia=ui.properties.indexOf(a),ib=ui.properties.indexOf(b);return (ia<0?99:ia)-(ib<0?99:ib)}).map(k=>`<div class="property-row"><input type="checkbox" data-prop="${k}" ${ui.properties.includes(k)?'checked':''} aria-label="Show ${k}"><span>${({date:'Publish date & time',owner:'Writer & designer',reference:'Reference',finalLink:'Final file',platforms:'Platforms',priority:'Priority',deadline:'Production deadline',campaign:'Campaign',checks:'Tasks & comments',stage:'Stage'})[k]}</span><button data-prop-up="${k}" aria-label="Move ${k} up">↑</button></div>`).join('')}<div class="utility-actions"><button data-action="advanced">Advanced filters</button><button data-action="show-columns">Show hidden columns</button><button class="primary" data-action="apply-options">Apply</button></div>`)}
function advancedFilters(){utility('Advanced filters',`<p class="field-note">Combine rules for this view. Save the view to reuse them.</p><select id="filter-logic" aria-label="Combine rules">${options({and:'Match all rules (AND)',or:'Match any rule (OR)'},ui.logic)}</select><div id="rules">${ui.advanced.map((r,i)=>`<div class="property-row">${select('rule-field-'+i,'Field',{title:'Title',stage:'Stage',writer:'Writer',designer:'Designer',campaign:'Campaign',finalLink:'Final URL',time:'Publish time',caption:'Caption'},r.field)}${select('rule-op-'+i,'Condition',{contains:'Contains',is:'Equals',not:'Does not equal',empty:'Is empty',notempty:'Is not empty'},r.op)}${input('rule-value-'+i,'Value','text',r.value)}<button data-rule-remove="${i}">×</button></div>`).join('')}</div><div class="utility-actions"><button data-action="add-rule">＋ Rule</button><button data-action="clear-rules">Clear rules</button><button class="primary" data-action="apply-rules">Apply filters</button></div>`)}
function download(name,text,type='application/json'){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function share(){utility('Share & export',`<p class="body-copy">Share the client calendar or keep a backup of your work.</p><div class="utility-actions"><button data-action="copy-view">Copy this view’s link</button><button data-action="export-json">Download JSON backup</button><button data-action="export-csv">Export filtered CSV</button><button data-action="export-html">Download HTML snapshot</button><button data-action="print">Print / Save PDF</button>${mode==='team'?'<button data-action="import">Import JSON / previous HTML</button><button data-action="new-month">New month / reuse ideas</button>':''}</div><p class="field-note" style="margin-top:20px">${configured?'The live link shows the latest online plan. Exported files are snapshots.':'The live website and this browser are separate until shared saving is connected. Export a backup to transfer local changes.'}</p>`)}
async function copyText(s){try{await navigator.clipboard.writeText(s);toast('Copied')}catch{utility('Copy this text',`<textarea rows="5">${esc(s)}</textarea>`)}}
function viewLink(post){const u=new URL(location.href);u.hash='';u.search='';u.searchParams.set('month',ui.month);u.searchParams.set('view',ui.view);if(post)u.searchParams.set('post',post);else for(const k of ['format','service','platform'])if(ui[k])u.searchParams.set(k,ui[k]);return u.href}
function settings(){inputForm('Workspace settings',input('teamName','Team name','text',data.settings.teamName)+input('editor','Your name / email','text',data.settings.editor)+input('timezone','Clinic timezone — e.g. Africa/Cairo','text',data.settings.timezone)+`<label class="wide">Team names / emails — one per line<textarea name="members" rows="4">${esc((data.settings.members||[]).join('\n'))}</textarea></label><p class="field-note wide">Team names help assignment and mentions. ${openEditing?'Anyone with the link can open the team workspace and edit. Names are labels, not verified accounts.':'Account access is granted separately by the workspace administrator.'}</p>`,'settings');$('#utility-content .panel-body').insertAdjacentHTML('beforeend','<div class="utility-actions"><button data-action="custom-field">＋ Custom field</button><button data-action="inbox">My mentions</button></div>')}
function account(){if(openEditing){inputForm('Your name',input('name','Name shown on your edits','text',ui.me)+'<p class="field-note wide">Optional. No login is needed. This name is saved only in this browser.</p>','guest-name');return}if(!configured){utility('Shared saving setup',`<p class="body-copy">Supabase is not connected yet. You can explore and edit a local preview; changes stay on this device.</p><div class="utility-actions"><button class="primary" data-action="local-team">Open local team preview</button></div>`);return}if(session){utility('Team account',`<p>${esc(session.user?.email||'Signed in')}</p><p class="field-note">${canEdit?'Your account can edit the shared workspace.':'Your account is signed in but does not have team access yet.'}</p><div class="utility-actions"><button data-action="logout">Sign out</button>${canEdit?'<button data-action="team-open">Open team workspace</button>':''}</div>`);return}utility('Team sign in',`<form id="login-form"><p class="field-note">Enter your team email. We’ll send a secure sign-in link. Only accounts granted workspace access can edit.</p><label style="margin-top:20px">Email<input name="email" type="email" required autocomplete="email"></label><div class="error" id="login-error"></div><div class="utility-actions"><button class="primary" type="submit">Send sign-in link</button></div></form>`)}
function captureRules(){ui.advanced=ui.advanced.map((r,i)=>({field:$(`[name="rule-field-${i}"]`)?.value||r.field,op:$(`[name="rule-op-${i}"]`)?.value||r.op,value:$(`[name="rule-value-${i}"]`)?.value||''}));ui.logic=$('#filter-logic')?.value||ui.logic}
async function action(a){switch(a){
case 'new':assertEdit();openPost(null);break;
case 'close-post':if(editorDirty&&!confirm('Discard this unsaved draft?'))return;editorDirty=false;editor=null;$('#post-dialog').close();break;
case 'close-utility':$('#utility').close();break;
case 'save-post':await savePost();break;
case 'account':account();break;
case 'local-team':mode='team';canEdit=true;ui.view='board';$('#utility').close();render();break;
case 'team-open':mode='team';ui.view='board';$('#utility').close();render();break;
case 'logout':await api('/auth/v1/logout',undefined,'POST').catch(()=>{});session=null;sessionStorage.removeItem('emz-session');canEdit=false;mode='client';$('#utility').close();revision=-1;await loadCloud(true);break;
case 'share':share();break;
case 'options':viewOptions();break;
case 'settings':assertEdit();settings();if(configured&&!openEditing)$('#utility-content .panel-body').insertAdjacentHTML('beforeend','<div class="utility-actions"><button data-action="access">Manage team access</button></div>');break;
case 'access':{const members=await api('/rest/v1/rpc/emz_access',{});utility('Team access',`<p class="field-note">Administrators can manage access. Editors can edit posts. The client link remains read-only.</p>${members.map(m=>`<div class="property-row"><span>${esc(m.email)} · ${esc(m.role)}</span><button data-revoke="${esc(m.email)}">Remove</button></div>`).join('')}<form id="access-form"><div class="field-grid">${input('email','Team email','email')}${select('role','Role',{editor:'Editor',admin:'Administrator'},'editor')}</div><div class="utility-actions"><button type="submit" class="primary">Grant access</button></div><p id="access-message" class="field-note"></p></form>`);break;}
case 'today':ui.month=today(data.settings.timezone).slice(0,7);ui.week=today(data.settings.timezone);render();break;
case 'prev':case 'next':{const n=a==='prev'?-1:1;if(ui.cal==='week'&&ui.view==='calendar'){ui.week=addDays(ui.week,n*7);ui.month=ui.week.slice(0,7)}else{const d=new Date(ui.month+'-15T12:00:00Z');d.setUTCMonth(d.getUTCMonth()+n);ui.month=d.toISOString().slice(0,7);ui.week=ui.month+'-01'}render();break;}
case 'clear':Object.assign(ui,{query:'',preset:'all',format:'',service:'',platform:'',advanced:[]});render();break;
case 'save-view':inputForm('Save current view',input('name','View name'),'save-view');break;
case 'show-columns':ui.hidden=[];render();if($('#utility').open)$('#utility').close();break;
case 'apply-options':for(const k of ['sort','size','fit','calc'])ui[k]=$(`[name="${k}"]`).value;ui.preview=$('[name="preview"]').checked;ui.color=$('[name="color"]').checked;const on=$$('[data-prop]:checked').map(e=>e.dataset.prop);ui.properties=[...ui.properties.filter(k=>on.includes(k)),...on.filter(k=>!ui.properties.includes(k))];$('#utility').close();render();break;
case 'advanced':advancedFilters();break;
case 'add-rule':captureRules();ui.advanced.push({field:'title',op:'contains',value:''});advancedFilters();break;
case 'clear-rules':ui.advanced=[];advancedFilters();break;
case 'apply-rules':captureRules();$('#utility').close();render();break;
case 'new-stage':utility('Manage board stages',Object.entries(data.stages).map(([k,v])=>`<div class="property-row"><span>${esc(v)}</span><button data-rename-stage="${esc(k)}">Rename</button><button data-stage-left="${esc(k)}" aria-label="Move ${esc(v)} left">←</button></div>`).join('')+'<div class="utility-actions"><button data-action="add-stage">＋ Add stage</button></div>');break;
case 'add-stage':inputForm('Add board stage',input('name','Stage name'),'new-stage');break;
case 'custom-field':inputForm('Add custom post field',input('label','Field label')+select('type','Field type',{text:'Text',number:'Number',date:'Date',url:'URL',checkbox:'Checkbox'},'text'),'custom-field');break;
case 'note':inputForm('Calendar note',input('date','Date','date',ui.month+'-01')+`<label>Note<textarea name="text" rows="3" required></textarea></label><label class="check"><input type="checkbox" name="internal">Internal team note</label>`,'note');break;
case 'copy-caption':await copyText(editor.caption);break;
case 'copy-post-link':await copyText(viewLink(editor.id));break;
case 'copy-view':await copyText(viewLink());break;
case 'export-json':download('EMZ-Calendar-'+today()+'.json',JSON.stringify(mode==='team'?data:clientDocument(data),null,2));break;
case 'export-csv':{const fields=['id','title','date','time','type','stage','platforms','caption','reference','finalLink','postingLink','service','campaign'];const cell=v=>'"'+String(Array.isArray(v)?v.join(', '):v||'').replace(/^[=+@-]/,"'$&").replace(/"/g,'""')+'"';download('EMZ-'+ui.month+'.csv','\ufeff'+[fields.join(','),...getPosts().map(p=>fields.map(k=>cell(p[k])).join(','))].join('\r\n'),'text/csv');break;}
case 'export-html':{let html=SOURCE_HTML;const exportData=mode==='team'?data:clientDocument(data);html=html.replace(/(<script id="seed" type="application\/json">)[\s\S]*?(<\/script>)/,(_,a,b)=>a+JSON.stringify(exportData).replace(/</g,'\\u003c')+b).replace(/(<script id="config" type="application\/json">)[\s\S]*?(<\/script>)/,'$1{}$2');download('EMZ-Content-Studio-'+today()+'.html',html,'text/html');break;}
case 'print':$('#utility').close();window.print();break;
case 'import':assertEdit();$('#import').click();break;
case 'new-month':inputForm('New month / reuse ideas',input('month','Target month','month',ui.month)+`<label class="check"><input name="copy" type="checkbox">Copy current month’s ideas</label><p class="field-note wide">Copies keep captions and briefs. Final files, published URLs, comments and production status reset. Publish times reset.</p>`,'new-month');break;
case 'archive-post':collectEditor();editor.archived=!editor.archived;markDirty();renderPost();break;
case 'duplicate-post':collectEditor();editor={...copy(editor),id:'EMZ-'+crypto.randomUUID().slice(0,8),title:editor.title+' (copy)',stage:'ideas',time:'',finalLink:'',postingLink:'',comments:[],history:[],versions:[],order:Date.now()};editorBase=copy(editor);markDirty();renderPost();break;
case 'template':collectEditor();if((editor.visual||editor.script||editor.checks.length)&&!confirm('Add a format checklist and fill only empty brief fields? Existing text will be kept.'))return;editor.visual=editor.visual||'Visual direction:\nBrand colors and typography:\nKey message:';editor.script=editor.script||(editor.type==='Reel/Video'?'Opening hook:\nMain message:\nClosing CTA:':'');editor.checks.push(...(editor.type==='Reel/Video'?['Write caption and script','Shoot footage','Edit reel and cover','Add final file URL']:editor.type==='Carousel'?['Write slide copy','Design slides in order','Check mobile readability','Add final carousel folder']:['Write caption and artwork text','Create artwork','Add final file URL']).map(label=>({label,done:false,owner:'',due:''})));markDirty();renderPost();break;
case 'add-check':inputForm('Add production task',input('label','Task')+input('owner','Assigned to')+input('due','Due date','date'),'check');break;
case 'add-comment':{const text=$('#comment-text').value.trim();if(!text)return;editor.comments.push({id:crypto.randomUUID(),text,author:actor(),at:new Date().toISOString()});markDirty();renderPost();break;}
case 'deselect':selected.clear();render();break;
case 'bulk-stage':inputForm('Move selected posts',select('stage','Stage',data.stages,'writing'),'bulk-stage');break;
case 'bulk-date':inputForm('Set publication date / time',input('date','Publish date','date')+input('time','Publish time','time'),'bulk-date');break;
case 'bulk-owner':inputForm('Assign selected posts',select('field','Responsibility',{writer:'Writer',designer:'Designer'},'writer')+input('owner','Name or email'),'bulk-owner');break;
case 'bulk-campaign':inputForm('Set campaign',input('campaign','Campaign'),'bulk-campaign');break;
case 'bulk-archive':await change(()=>data.posts.filter(p=>selected.has(p.id)).forEach(p=>{const old=copy(p);p.archived=true;log(p,'Archived post',old)}),'Posts archived');selected.clear();render();break;
case 'undo':if(undo){const previous=copy(undo);await change(()=>{data=previous},'Previous change restored')}break;
case 'recover':{assertEdit();const recovery=JSON.parse(localStorage.getItem(LOCAL_KEY+':recovery')||'null');if(!recovery?.data)throw Error('No recovery copy found.');data=migrate(recovery.data);pending=true;conflict=recovery.baseRevision!==revision;if(conflict)showNotice('Your recovery copy is open. The online workspace has newer changes; use Resolve conflict.');else showNotice('Your recovery copy is open. Use Retry save to save it online.');render();break;}
case 'retry':if(canEdit&&!saving&&!conflict)await persist('Changes saved online');break;
case 'conflict':utility('Resolve edit conflict',`<p class="body-copy">Someone saved a newer version while you were editing. Your work has not overwritten theirs.</p><p class="field-note">Download your recovery copy first, then load the current online plan. Reapply the changes you want to keep.</p><div class="utility-actions"><button data-action="export-json">Download my recovery copy</button><button class="primary" data-action="load-latest">Load current online plan</button></div>`);break;
case 'load-latest':if(confirm('Load the online plan? Download your recovery copy first if you want to keep your local changes.')){pending=false;conflict=false;editorDirty=false;editor=null;$('#post-dialog').close();$('#utility').close();revision=-1;await loadCloud(true)}break;

case 'inbox':{const me=actor();const list=data.posts.flatMap(p=>p.comments.filter(c=>c.text.toLowerCase().includes('@'+me.toLowerCase())).map(c=>({p,c})));utility('My mentions',list.map(({p,c})=>`<div class="comment"><button data-post="${esc(p.id)}">${esc(p.title)}</button><p>${esc(c.text)}</p><small>${esc(c.author)} · ${new Date(c.at).toLocaleString()}</small></div>`).join('')||'<p class="muted">No mentions for '+esc(me)+'.</p>');break;}
}}
document.addEventListener('click',async e=>{try{const el=e.target.closest('button,a');if(el?.dataset.action){e.preventDefault();await action(el.dataset.action);return}if(el?.dataset.mode){if(el.dataset.mode==='team'&&configured&&!canEdit){if(openEditing){toast('Connecting to the shared workspace. Please try again.');return}account();return}mode=el.dataset.mode;if(!configured)canEdit=mode==='team';if(mode==='client'){ui.view='calendar';ui.preset='all';selected.clear()}else ui.view='board';render();return}if(el?.dataset.view){ui.view=el.dataset.view;render();return}if(el?.dataset.post){if($('#utility').open)$('#utility').close();openPost(el.dataset.post);return}if(el?.dataset.revoke){if(confirm('Remove workspace access for '+el.dataset.revoke+'?')){await api('/rest/v1/rpc/emz_access',{operation:'revoke',member_email:el.dataset.revoke});await action('access')}return}if(el?.dataset.renameStage){inputForm('Rename stage',`<input type="hidden" name="id" value="${esc(el.dataset.renameStage)}">`+input('name','Stage name','text',data.stages[el.dataset.renameStage]),'rename-stage');return}if(el?.dataset.stageLeft){const vals=[...ui.columns,...Object.keys(data.stages).filter(k=>!ui.columns.includes(k))],i=vals.indexOf(el.dataset.stageLeft);if(i>0)[vals[i-1],vals[i]]=[vals[i],vals[i-1]];ui.columns=vals;render();return}if(el?.dataset.editorTab){collectEditor();editorTab=el.dataset.editorTab;renderPost();return}if(el?.dataset.cal){ui.cal=el.dataset.cal;ui.week=ui.month===today().slice(0,7)?today():ui.month+'-01';render();return}if(el?.dataset.feed){ui.feed=el.dataset.feed;render();return}if(el?.dataset.addDate){assertEdit();openPost(null,{date:el.dataset.addDate});return}if(el?.dataset.addGroup){assertEdit();const values={};if(ui.group==='platforms')values.platforms=el.dataset.addGroup==='Unassigned'?[]:[el.dataset.addGroup];else values[ui.group]=el.dataset.addGroup==='Unassigned'?'':el.dataset.addGroup;if(ui.subgroup&&el.dataset.sub)values[ui.subgroup]=el.dataset.sub;openPost(null,values);return}if(el?.dataset.hide){ui.hidden.push(el.dataset.hide);render();return}if(el?.dataset.menu){const p=data.posts.find(x=>x.id===el.dataset.menu);openPost(p.id);return}if(el?.dataset.propUp){const k=el.dataset.propUp,i=ui.properties.indexOf(k);if(i>0)[ui.properties[i-1],ui.properties[i]]=[ui.properties[i],ui.properties[i-1]];viewOptions();return}if(el?.dataset.ruleRemove){captureRules();ui.advanced.splice(+el.dataset.ruleRemove,1);advancedFilters();return}if(el?.dataset.deleteCheck){editor.checks.splice(+el.dataset.deleteCheck,1);markDirty();renderPost();return}if(el?.dataset.version){const old=editor.versions[+el.dataset.version];if(confirm('Restore this version into the draft? Save post to apply.')){editor={...copy(old.data),history:editor.history,versions:editor.versions};markDirty();renderPost()}return}const day=e.target.closest('[data-date]');if(day&&window.innerWidth<=760&&!e.target.closest('button'))$('#day-'+day.dataset.date)?.scrollIntoView({behavior:'smooth',block:'start'});}catch(err){toast(err.message)}});
document.addEventListener('input',e=>{if(e.target.id==='search'){ui.query=e.target.value;const at=e.target.selectionStart;render();$('#search').focus();$('#search').setSelectionRange?.(at,at)}if(e.target.closest('#edit-form')){collectEditor();markDirty()}});
document.addEventListener('change',async e=>{const t=e.target;try{if(['month','format','service','platform','group','subgroup','preset'].includes(t.id)){if(t.id==='preset'){const saved=data.views.find(v=>v.id===t.value);if(saved){ui={...ui,...saved.config,preset:saved.id};render();return}}ui[t.id]=t.value;if(t.id==='month')ui.week=t.value+'-01';if(t.id==='group'){ui.hidden=[];ui.columns=[]}selected.clear();render();return}if(t.dataset.select){t.checked?selected.add(t.dataset.select):selected.delete(t.dataset.select);render();return}if(t.id==='select-all'){selected=t.checked?new Set(getPosts().map(p=>p.id)):new Set();render();return}if(t.dataset.move){const p=data.posts.find(p=>p.id===t.dataset.move),val=t.value;if(val==='published'&&!confirm('Confirm this post is already published on the social platform.')){render();return}await change(()=>{const prev=copy(p);move(p,'stage',val);log(p,'Moved to '+data.stages[val],prev)},'Stage updated');return}if(t.dataset.inline){await change(()=>{const p=data.posts.find(p=>p.id===t.dataset.id),prev=copy(p);p[t.dataset.inline]=t.value;log(p,'Updated publication '+t.dataset.inline,prev)},'Publication details saved');return}if(t.dataset.check){editor.checks[+t.dataset.check].done=t.checked;markDirty()}if(t.closest('#edit-form')){collectEditor();markDirty()}}catch(err){toast(err.message);render()}});
document.addEventListener('submit',async e=>{e.preventDefault();const f=e.target;if(f.id==='access-form'){const v=Object.fromEntries(new FormData(f));try{await api('/rest/v1/rpc/emz_access',{operation:'grant',member_email:v.email,member_role:v.role});await action('access');$('#access-message').textContent='Access granted. Share the site link; this person can sign in using their email.'}catch(err){$('#access-message').textContent=err.message}return}if(f.id==='login-form'){const b=f.querySelector('button');b.disabled=true;try{await api('/auth/v1/otp?redirect_to='+encodeURIComponent(location.origin+location.pathname),{email:new FormData(f).get('email'),create_user:true},'POST',false);$('#login-error').textContent='Check your email for the sign-in link.'}catch(err){$('#login-error').textContent=err.message}finally{b.disabled=false}return}if(f.id!=='utility-form')return;const v=Object.fromEntries(new FormData(f)),a=f.dataset.form;try{if(a==='guest-name'){ui.me=v.name.trim().slice(0,80);persistUI();$('#utility').close();render();return}if(a==='check'){editor.checks.push({label:v.label,owner:v.owner,due:v.due,done:false});markDirty();$('#utility').close();renderPost();return}await change(()=>{switch(a){case 'settings':if(v.timezone)new Intl.DateTimeFormat('en',{timeZone:v.timezone}).format();data.settings={...data.settings,...v,members:v.members.split('\n').map(x=>x.trim()).filter(Boolean)};ui.me=v.editor;break;case 'save-view':data.views.push({id:'saved-'+crypto.randomUUID(),name:v.name||'Saved view',config:{...copy(ui),preset:ui.preset.startsWith('saved-')?'all':ui.preset}});break;case 'rename-stage':if(!v.name.trim())throw Error('Enter a name.');data.stages[v.id]=v.name;break;case 'new-stage':if(!v.name.trim())throw Error('Enter a name.');data.stages['stage-'+crypto.randomUUID().slice(0,8)]=v.name;break;case 'custom-field':data.customFields.push({id:'field-'+crypto.randomUUID().slice(0,8),label:v.label,type:v.type});break;case 'note':if(!date(v.date))throw Error('Set a valid note date.');data.notes.push({id:crypto.randomUUID(),date:v.date,text:v.text,internal:!!v.internal});break;case 'new-month':if(!/^\d{4}-\d{2}$/.test(v.month))throw Error('Choose a month.');if(v.copy){const max=new Date(+v.month.slice(0,4),+v.month.slice(5),0).getDate();const posts=data.posts.filter(p=>!p.archived&&p.date.startsWith(ui.month));data.posts.push(...posts.map(p=>({...copy(p),id:'EMZ-'+crypto.randomUUID().slice(0,8),date:v.month+'-'+String(Math.min(+p.date.slice(8),max)).padStart(2,'0'),time:'',stage:'ideas',finalLink:'',postingLink:'',cover:'',media:'',history:[],comments:[],versions:[],checks:p.checks.map(c=>({...c,done:false,due:''})),order:Date.now()})))}ui.month=v.month;break;default:for(const p of data.posts.filter(p=>selected.has(p.id))){if(a==='bulk-stage'&&v.stage==='ready'&&!url(p.finalLink))throw Error('Every selected post needs a final URL before becoming Ready.')}if(a==='bulk-stage'&&v.stage==='published'&&!confirm('Confirm all selected posts are already published.'))return;for(const p of data.posts.filter(p=>selected.has(p.id))){const old=copy(p);if(a==='bulk-stage')move(p,'stage',v.stage);if(a==='bulk-date'){p.date=v.date;p.time=v.time}if(a==='bulk-owner')p[v.field]=v.owner;if(a==='bulk-campaign')p.campaign=v.campaign;log(p,'Bulk update',old)}}},'Changes saved');$('#utility').close();render()}catch(err){$('#utility-error').textContent=err.message}});
document.addEventListener('dragstart',e=>{const col=e.target.closest('[data-column]'),card=e.target.closest('[data-card]');if(col){drag={column:col.dataset.column};e.dataTransfer.setData('text/plain',col.dataset.column)}else if(card&&mode==='team'&&canEdit&&!saving){drag={id:card.dataset.card};e.dataTransfer.setData('text/plain',card.dataset.card)}else e.preventDefault()});
document.addEventListener('dragover',e=>{if(!drag)return;const target=e.target.closest('[data-lane],[data-date]');if(target){e.preventDefault();$$('.drag-over').forEach(x=>x.classList.remove('drag-over'));target.classList.add('drag-over')}});

document.addEventListener('drop',async e=>{try{if(!drag)return;e.preventDefault();const target=e.target.closest('[data-lane],[data-date]'),d=drag;drag=null;$$('.drag-over').forEach(x=>x.classList.remove('drag-over'));if(!target)return;if(d.column&&target.dataset.lane){const vals=[...$$('[data-column]')].map(x=>x.dataset.column).filter((x,i,a)=>a.indexOf(x)===i);const without=vals.filter(x=>x!==d.column);without.splice(without.indexOf(target.dataset.lane),0,d.column);ui.columns=without;render();return}const p=data.posts.find(p=>p.id===d.id);if(!p)return;if(ui.group==='stage'&&target.dataset.lane==='published'&&!confirm('Confirm this post has been published on the social platform.'))return;await change(()=>{const prev=copy(p);if(target.dataset.date)p.date=target.dataset.date;else{const val=target.dataset.lane==='Unassigned'?'':target.dataset.lane;if(ui.group==='platforms')p.platforms=val?[val,...p.platforms.filter(x=>x!==val)]:[];else move(p,ui.group,val);if(ui.subgroup&&target.dataset.sub)p[ui.subgroup]=target.dataset.sub==='Unassigned'?'':target.dataset.sub;const before=e.target.closest('[data-card]');const inLane=data.posts.filter(x=>groupValue(x,ui.group)===groupValue(p,ui.group)&&x.id!==p.id).sort((a,b)=>a.order-b.order);const at=before?inLane.findIndex(x=>x.id===before.dataset.card):-1;inLane.splice(at<0?inLane.length:at,0,p);inLane.forEach((x,i)=>x.order=i);ui.sort='manual'}log(p,'Moved post',prev)},'Post moved')}catch(error){toast(error.message);render()}});

$('#import').addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;try{assertEdit();if(file.size>15000000)throw Error('Backup is too large.');const raw=await file.text();let value;if(file.name.endsWith('.html')){const doc=new DOMParser().parseFromString(raw,'text/html');value=JSON.parse(doc.querySelector('#seed').textContent)}else value=JSON.parse(raw);const imported=migrate(value);if(!confirm(`Replace this workspace with ${imported.posts.length} imported posts? A backup will download first.`))return;download('EMZ-before-import.json',JSON.stringify(data,null,2));await change(()=>{data=imported},'Backup imported');$('#utility').close()}catch(err){toast(err.message)}finally{e.target.value=''}});
async function init(){const authHash=new URLSearchParams(location.hash.slice(1));if(!openEditing&&authHash.has('access_token')){session={access_token:authHash.get('access_token'),refresh_token:authHash.get('refresh_token'),expires_at:Date.now()/1000+Number(authHash.get('expires_in')||3600)};history.replaceState(null,'',location.pathname+location.search);if(configured){try{session.user=await api('/auth/v1/user',undefined,'GET');sessionStorage.setItem('emz-session',JSON.stringify(session))}catch{session=null}}}ui.view='calendar';const params=new URLSearchParams(location.search);for(const k of ['month','view','format','service','platform'])if(params.has(k))ui[k]=params.get(k);if(!['calendar','board','table','feed'].includes(ui.view))ui.view='calendar';if(!/^\d{4}-\d{2}$/.test(ui.month))ui.month=today().slice(0,7);ui.preset='all';render();if(configured){await loadCloud(true);if(session&&canEdit){mode='team';ui.me=session.user?.email||'';render()}setInterval(()=>{if(!document.hidden)loadCloud()},12000)}if(params.get('post')&&data.posts.some(p=>p.id===params.get('post')))openPost(params.get('post'));}
